<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picture, source y media</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <picture>
        <source media="(max-width: 400px)" srcset="arbol-small.jpg">
        <source media="(max-width: 600px)" srcset="arbol-medium.jpg">
        <img src="arbol.jpg" alt="">
    </picture>
</body>
</html>
