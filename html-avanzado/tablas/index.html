<!DOCTYPE html>
<html lang="en">
<head>
    <title>Tablas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>Productos</th>
                <th>Costo</th>
                <th>Unidades</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Banana</td>
                <td>$3</td>
                <td>1KG</td>
            </tr>
            <tr>
                <td>Manzana</td>
                <td>$2</td>
                <td>1KG</td>
            </tr>
            <tr>
                <td>Melon</td>
                <td>$4</td>
                <td>1 unidad</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th class="header-total">Total</th>
                <td class="dato-total" colspan="2">$9</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
