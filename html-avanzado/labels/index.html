<!DOCTYPE html>
<html lang="en">
<head>
    <title>Textarea</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <form>
        <h2>Formulario de contacto</h2>
        <div class="form_input">
            <label for="nombre">Nombre completo</label>
            <input type="text" name="nombre" placeholder="Gustavo Pérez" id="nombre">
        </div>
        <div class="form_input">
            <label for="email">Email</label>
            <input type="email" name="email" placeholder="gustavo.perez@example.com" id="email">
        </div>
        <div class="form_input">
            <label for="mensaje">Mensaje</label>
            <textarea name="mensaje" placeholder="Deja tu mensaje aquí..." id="mensaje"></textarea>
        </div>
        <div class="form_input">
            <label>
                Acepto los términos y condiciones
                <input type="checkbox" name="terminos" id="terminos" class="checkbox">
            </label>
        </div>
    </form>
</body>
</html>
