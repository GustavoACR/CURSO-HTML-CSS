<!DOCTYPE html>
<html lang="en">
    
    <head>
        <title>Formularios</title>
    </head>

    <body>

        <form >

            <input type="text" name="username" placeholder="Nombre de usuario" required minlength="3" maxlength="100">
            <input type="email" name="email" placeholder="Correo electrónico" required>
            <input type="password" name="password" placeholder="Contraseña" required minlength="6" maxlength="100">
            <input type="checkbox" name="checkbox" placeholder="Acepto los términos y condiciones" required>
            <input type="radio" name="radio" placeholder="Opción 1" required>
            <input type="file" name="file" placeholder="Seleccionar archivo" required>
            <input type="date" name="date" placeholder="Seleccionar fecha" required>
            <input type="submit" name="submit" placeholder="Enviar formulario" required>

        </form>

    </body>
</html>
