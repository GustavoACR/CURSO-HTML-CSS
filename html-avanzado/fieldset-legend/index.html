<!DOCTYPE html>
<html lang="en">
<head>
    <title>Textarea</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <form>
        <h2>Formulario de contacto</h2>
        <fieldset>
            <legend>INFORMACION BASICA</legend>
            <!-- SIMMPLE INPUT -->
            <div class="form_input">
                <label for="nombre">Nombre completo</label>
                <input type="text" name="nombre" placeholder="Gustavo Pérez" id="nombre">
            </div>
            <div class="form_input">
                <label for="email">Email</label>
                <input type="email" name="email" placeholder="gustavo.perez@example.com" id="email">
            </div>
            <div class="form_input">
                <label for="asunto">Asunto</label>
                <input type="text" name="asunto" placeholder="Asunto de tu mensaje" id="asunto">
            </div>
        </fieldset>
        <!-- SELECT Y OPTION -->   
        <div class="form_input">
            <label>Tipo de usuario
            <select name="type-of-user">
                <option value="user1">Seguidor</option>
                <option value="user2">Empresa</option>
                <option value="user3">Otros</option>
            </select>
            </label>
        </div>
        <!-- DETALIST Y OPTION -->
        <div class="form_input">
            <label>Referente
                <input list="referente" name="referente">
            <datalist id="referente" name="type-of-user">
                <option value="Soy Dalto">Un creador de contenido</option>
                <option value="user2">Empresa</option>
                <option value="user3">Otros</option>
            </datalist>
            </label>
        </div>
        <!-- TEXTAREA-->
        <div class="form_input">
            <label for="mensaje">Mensaje</label>
            <textarea name="mensaje" placeholder="Deja tu mensaje aquí..." id="mensaje"></textarea>
        </div>
        <!-- CHECKBOX -->
        <div class="form_input">
            <label>
                Acepto los términos y condiciones
                <input type="checkbox" name="terminos" id="terminos" class="checkbox">
            </label>
        </div>
    </form>
</body>
</html>
